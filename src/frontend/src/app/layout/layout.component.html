<div class="layout">
  <header class="mobile-appbar">
    <div class="mobile-brand">
      <img src="assets/images/logo-dalba-300x141.webp" alt="Logo Dalba">
      <span>Gestão de documentos</span>
    </div>
    <button class="mobile-menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
      <strong>Menu</strong>
    </button>
  </header>

  <div class="mobile-menu-backdrop" [class.open]="menuOpen" (click)="closeMenu()"></div>

  <aside class="sidebar" [class.open]="menuOpen">
    <div class="sidebar-brand">
      <div class="sidebar-logo-wrap">
        <img class="sidebar-logo" src="assets/images/logo-dalba-300x141.webp" alt="Logo Dalba">
      </div>
      <p>Gestão de envio de documentos</p>
    </div>
    <nav class="nav flex-column gap-2">
      <a class="nav-link menu-link" routerLink="/dashboard" (click)="closeMenu()">Dashboard</a>
      <a class="nav-link menu-link" routerLink="/usuarios" *ngIf="auth.role === 'Admin'" (click)="closeMenu()">Usuários</a>
      <a class="nav-link menu-link" routerLink="/fornecedores" *ngIf="auth.role !== 'Fornecedor'" (click)="closeMenu()">Fornecedores</a>
      <a class="nav-link menu-link" routerLink="/categorias" *ngIf="auth.role === 'Admin'" (click)="closeMenu()">Categorias</a>
      <a class="nav-link menu-link" routerLink="/contratos" (click)="closeMenu()">Contratos</a>
      <a class="nav-link menu-link" routerLink="/documentos" *ngIf="auth.role === 'Admin'" (click)="closeMenu()">Documentos</a>
      <a class="nav-link menu-link" routerLink="/documentos-exigidos" *ngIf="auth.role === 'Admin'" (click)="closeMenu()">Documentos Exigidos</a>
      <a class="nav-link menu-link" routerLink="/portal-fornecedor" *ngIf="auth.role === 'Fornecedor'" (click)="closeMenu()">Envio Mensal</a>
      <a class="nav-link menu-link" routerLink="/envio-nf" *ngIf="auth.role === 'Fornecedor'" (click)="closeMenu()">Envio NF</a>
      <a class="nav-link menu-link" routerLink="/admin-validacao" *ngIf="auth.role !== 'Fornecedor'" (click)="closeMenu()">Validação</a>
      <a class="nav-link menu-link" routerLink="/financeiro" *ngIf="auth.role !== 'Fornecedor'" (click)="closeMenu()">Custos</a>
      <a class="nav-link menu-link" routerLink="/notificacoes" (click)="closeMenu()">Notificações</a>
      <a class="nav-link menu-link" routerLink="/configuracoes" *ngIf="auth.role === 'Admin'" (click)="closeMenu()">Configuração</a>
    </nav>
    <button class="btn btn-light mt-auto" (click)="auth.logout(); closeMenu()">Sair</button>
  </aside>
  <main class="content">
    <header class="topbar card">
      <div>
        <strong>{{ auth.session?.nome }}</strong>
        <div>{{ roleLabel }}</div>
      </div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
