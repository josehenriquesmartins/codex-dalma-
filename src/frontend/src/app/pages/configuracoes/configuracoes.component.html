<section class="page-shell">
  <div class="toolbar">
    <div>
      <h2 class="mb-1">Configuração</h2>
      <p class="section-subtitle">Parâmetros globais de integração e comunicação.</p>
    </div>
  </div>

  <form class="card crud-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="card-title mb-3">SMTP</div>
    <div class="row g-3">
      <div class="col-12 col-md-6"><label class="form-label">Host *</label><input class="form-control" formControlName="smtpHost"></div>
      <div class="col-12 col-md-2"><label class="form-label">Porta *</label><input class="form-control" formControlName="smtpPorta"></div>
      <div class="col-12 col-md-4"><label class="form-label">Usuário</label><input class="form-control" formControlName="smtpUsuario"></div>
      <div class="col-12"><label class="form-label">Senha</label><input class="form-control" type="password" formControlName="smtpSenha"></div>
    </div>

    <div class="card-title mt-4 mb-3">SMS</div>
    <div class="row g-3">
      <div class="col-12 col-md-3"><label class="form-label">Provider</label><input class="form-control" formControlName="smsProvider"></div>
      <div class="col-12 col-md-3"><label class="form-label">Conta</label><input class="form-control" formControlName="smsConta"></div>
      <div class="col-12 col-md-3"><label class="form-label">Token</label><input class="form-control" formControlName="smsToken"></div>
      <div class="col-12 col-md-3"><label class="form-label">Remetente</label><input class="form-control" formControlName="smsRemetente"></div>
    </div>

    <div class="card-title mt-4 mb-3">APIs</div>
    <div class="row g-3">
      <div class="col-12 col-md-6"><label class="form-label">API KEY IA</label><input class="form-control" formControlName="iaApiKey"></div>
      <div class="col-12 col-md-6"><label class="form-label">API KEY WhatsApp</label><input class="form-control" formControlName="whatsAppApiKey"></div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit" [disabled]="salvando || carregando">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="salvando"></span>
        {{ salvando ? 'Salvando...' : 'Salvar configurações' }}
      </button>
      <button class="btn btn-outline-secondary" type="button" (click)="load()" [disabled]="carregando">Recarregar</button>
    </div>
  </form>
</section>
