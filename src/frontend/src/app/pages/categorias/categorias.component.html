<section class="page-shell">
  <div class="toolbar"><div><h2 class="mb-1">Categorias</h2><p class="section-subtitle">Consulte a lista e clique em Novo para cadastrar.</p></div><button class="btn btn-primary" type="button" (click)="abrirNovo()">Nova categoria</button></div>
  <div class="crud-stack">
    <div class="card crud-card">
      <div class="card-title">Lista de categorias</div>
      <div class="mb-3">
        <input class="form-control" type="search" placeholder="Pesquisar..." [(ngModel)]="filtro" (ngModelChange)="pagina = 1">
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0"><thead><tr><th>Código</th><th>Descrição</th><th>Ativo</th><th class="text-end">Ações</th></tr></thead><tbody><tr *ngFor="let item of categorias | filtroTexto:filtro | slice:(pagina-1)*tamanho:pagina*tamanho"><td>{{item.codigo}}</td><td>{{item.descricao}}</td><td>{{ item.ativo ? 'Sim' : 'Não' }}</td><td class="text-end"><div class="actions justify-content-end"><button type="button" class="btn btn-outline-primary btn-sm" (click)="edit(item)">Editar</button><button type="button" class="btn btn-danger btn-sm" (click)="remove(item)">Excluir</button></div></td></tr></tbody></table>
      </div>
      <app-paginacao [total]="(categorias | filtroTexto:filtro).length" [pagina]="pagina" [tamanho]="tamanho" (paginaChange)="pagina = $event" (tamanhoChange)="tamanho = $event; pagina = 1"></app-paginacao>
    </div>
  </div>

  <div class="crud-modal-backdrop" *ngIf="modalAberto">
    <div class="crud-modal" (click)="$event.stopPropagation()">
      <div class="crud-modal-header">
        <div class="card-title">{{ editingId ? 'Alterar categoria' : 'Incluir categoria' }}</div>
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="cancelEdit()">✕</button>
      </div>
      <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row g-3">
        <div class="col-12 col-md-4"><label class="form-label required">Código</label><input class="form-control" formControlName="codigo"><div class="field-error" *ngIf="form.get('codigo')?.touched && form.get('codigo')?.hasError('required')">Informe o código.</div></div>
        <div class="col-12 col-md-8"><label class="form-label required">Descrição</label><input class="form-control" formControlName="descricao"><div class="field-error" *ngIf="form.get('descricao')?.touched && form.get('descricao')?.hasError('required')">Informe a descrição.</div></div>
        <div class="col-12 d-flex gap-2 flex-wrap"><button class="btn btn-primary" [disabled]="form.invalid">{{ editingId ? 'Atualizar categoria' : 'Salvar categoria' }}</button><button type="button" class="btn btn-outline-secondary" (click)="cancelEdit()">Cancelar</button></div>
      </div>
      </form>
    </div>
  </div>
</section>
