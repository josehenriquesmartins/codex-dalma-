services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - ./deploy/database.sql:/docker-entrypoint-initdb.d/01-create-dalba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    environment:
      Seed__DemoData: "false"
    depends_on:
      postgres:
        condition: service_healthy
