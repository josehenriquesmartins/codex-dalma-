services:
  postgres:
    image: postgres:16-alpine
    container_name: dalba-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - dalba-postgres-data:/var/lib/postgresql/data
      - ./database/01-create-dalba.sql:/docker-entrypoint-initdb.d/01-create-dalba.sql

  api:
    build:
      context: ./src/backend
      dockerfile: Dalba.Financeiro.Api/Dockerfile
    container_name: dalba-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "${API_PORT}:8080"
    volumes:
      - dalba-uploads:/app/storage/uploads
    depends_on:
      - postgres

  web:
    build:
      context: ./src/frontend
      dockerfile: src/frontend.Dockerfile
    container_name: dalba-web
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api

volumes:
  dalba-postgres-data:
  dalba-uploads:
